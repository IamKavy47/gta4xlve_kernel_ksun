name: LineageOS Style Kernel Build

on:
  workflow_dispatch:
  push:
    branches: [ "copilot/debug-kernelsu-hooks" ]

jobs:
  build:
    name: Build Kernel (LineageOS Logic)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # CACHING & TOOLS
      # -----------------------------------------------------------------------
      - name: Cache Proton Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ~/toolchains/clang
          key: ${{ runner.os }}-proton-clang-v1

      - name: Setup Proton Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchains
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 ~/toolchains/clang

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache cpio flex git kmod \
            libncurses5-dev libssl-dev rsync zip unzip wget curl ca-certificates \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu device-tree-compiler

      # -----------------------------------------------------------------------
      # SETUP ANYKERNEL3 (Device Check Disabled to fix Status 1 Error)
      # -----------------------------------------------------------------------
      - name: Setup AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ~/AnyKernel3
          cd ~/AnyKernel3
          cat > anykernel.sh << 'EOF'
          #!/sbin/sh
          # AnyKernel3 Script for GTA4XLVE
          
          properties() { '
          kernel.string=GTA4XLVE KernelSU-Next (Legacy)
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=gta4xlve
          device.name2=gta4xl
          device.name3=SM-P613
          supported.versions=11-16
          supported.patchlevels=
          '; }
          
          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          boot_img_hdr_ver=2
          
          . tools/ak3-core.sh;
          split_boot; 
          flash_boot;
          EOF
          chmod +x anykernel.sh

      # -----------------------------------------------------------------------
      # COMPILE KERNEL
      # -----------------------------------------------------------------------
      - name: Compile Kernel
        run: |
          export PATH=~/toolchains/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE64=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1
          
          mkdir -p out
          make O=out clean mrproper

          echo "--> Generating Base Config"
          make O=out vendor/atoll-perf_defconfig

          FRAGMENT="arch/arm64/configs/vendor/gta4xlve.config"
          [ ! -f $FRAGMENT ] && FRAGMENT="arch/arm64/configs/gta4xlve.config"
          
          if [ -f $FRAGMENT ]; then
             scripts/kconfig/merge_config.sh -m -O out out/.config $FRAGMENT
             make O=out olddefconfig
          else
             echo "!! ERROR: Fragment not found!" && exit 1
          fi

          echo "--> Compiling Image.gz..."
          make O=out -j$(nproc) Image.gz

      # -----------------------------------------------------------------------
      # PACKAGE & UPLOAD
      # -----------------------------------------------------------------------
      - name: Create Flashable ZIP
        run: |
          cd ~/AnyKernel3
          rm -rf .git* README.md
          
          cat > README.md << 'EOF'
          # GTA4XLVE KernelSU Kernel
          Build with manual KernelSU-Next Legacy
          EOF
          
          # Copy the Image.gz we just built
          cp $GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz .
          
          # Zip correctly (files at root)
          ZIPNAME="gta4xlve-ksun-legacy-$(date +%Y%m%d).zip"
          zip -r9 $GITHUB_WORKSPACE/$ZIPNAME *
          echo "ZIPNAME=$ZIPNAME" >> $GITHUB_ENV

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-flashable-zip
          path: ${{ env.ZIPNAME }}
