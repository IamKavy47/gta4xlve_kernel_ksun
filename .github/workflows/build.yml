name: LineageOS Style Kernel Build

on:
  workflow_dispatch:
  push:
    branches: [ "copilot/debug-kernelsu-hooks" ]

jobs:
  build:
    name: Build Kernel (LineageOS Logic)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # CACHING: Saves time by not re-downloading Clang every run
      # -----------------------------------------------------------------------
      - name: Cache Proton Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ~/toolchains/clang
          key: ${{ runner.os }}-proton-clang-v1

      - name: Setup Proton Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchains
          echo "Cloning Proton Clang..."
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 ~/toolchains/clang

      # -----------------------------------------------------------------------
      # DEPENDENCIES: Standard build tools required by kernel.mk
      # -----------------------------------------------------------------------
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache cpio flex git kmod \
            libncurses5-dev libssl-dev rsync zip unzip wget curl ca-certificates \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu device-tree-compiler

      # -----------------------------------------------------------------------
      # KERNELSU: The "Trick" - Linking it before build
      # -----------------------------------------------------------------------
      - name: Setup KernelSU-Next
        run: |
          if [ ! -d "KernelSU-Next/kernel" ]; then
            git submodule update --init --recursive
          fi
          mkdir -p drivers
          ln -sf ../KernelSU-Next/kernel drivers/kernelsu
          
          # Ensure it's in the Makefile (Safety check)
          if ! grep -q "kernelsu" drivers/Makefile; then
            echo "obj-y += kernelsu/" >> drivers/Makefile
          fi
          
          # Apply patch to fix hook check during clean/build
          echo "Applying KernelSU hook check fix..."
          patch -p1 < kernelsu_hook_check.patch
          
          echo "✓ KernelSU-Next linked and patched"

      - name: Setup AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ~/AnyKernel3
          cd ~/AnyKernel3
          cat > anykernel.sh << 'EOF'
          properties() {
          kernel.string=GTA4XLVE KernelSU-Next
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          device.name1=gta4xlve
          device.name2=gta4xl
          device.name3=SM-P613
          device.name4=SM-P610
          }
          boot_img_hdr_ver=2
          split_boot;
          flash_boot;
          EOF
          chmod +x anykernel.sh

      # -----------------------------------------------------------------------
      # BUILD LOGIC: Extracted directly from LineageOS kernel.mk
      # -----------------------------------------------------------------------
      - name: Compile Kernel
        run: |
          # 1. Setup Environment Variables (mimicking BoardConfig.mk)
          export PATH=~/toolchains/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE64=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # Flags found in kernel.mk
          export LLVM=1
          export LLVM_IAS=1
          
          # 2. Clean
          mkdir -p out
          make O=out clean mrproper

          # 3. Build Base Config (TARGET_KERNEL_CONFIG)
          echo "--> Generating Base Config: vendor/atoll-perf_defconfig"
          make O=out vendor/atoll-perf_defconfig

          # 4. Merge Fragment (The 'kernel.mk' Logic)
          # We search for the gta4xlve fragment and merge it using the kernel's script
          FRAGMENT="arch/arm64/configs/vendor/gta4xlve.config"
          if [ ! -f $FRAGMENT ]; then
             FRAGMENT="arch/arm64/configs/gta4xlve.config"
          fi
          
          if [ -f $FRAGMENT ]; then
             echo "--> Merging Fragment: $FRAGMENT"
             # This is the exact script Lineage uses to merge configs
             scripts/kconfig/merge_config.sh -m -O out out/.config $FRAGMENT
             make O=out olddefconfig
          else
             echo "!! ERROR: gta4xlve.config fragment not found!"
             exit 1
          fi

          # 5. Compile (KERNEL_MAKE_CMD)
          # Note: With CONFIG_BUILD_ARM64_DT_OVERLAY=y, dtbs target only builds overlays (dtbo)
          # Image.gz-dtb will find and append any existing .dtb files via shell find command
          # LineageOS approach: let Image.gz-dtb handle its own DTB dependencies
          
          echo "--> Compiling Image.gz-dtb..."
          set -o pipefail
          make O=out -j$(nproc) Image.gz-dtb 2>&1 | tee build.log
          BUILD_STATUS=$?
          
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "Build failed with status $BUILD_STATUS"
            echo "Last 100 lines of build log:"
            tail -100 build.log
            exit $BUILD_STATUS
          fi

      # -----------------------------------------------------------------------
      # PACKAGING: AnyKernel3
      # -----------------------------------------------------------------------
      - name: Create Flashable ZIP
        run: |
          cd ~/AnyKernel3
          rm -rf .git* README.md
          
          # Copy Artifacts
          if [ -f $GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb ]; then
             cp $GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb .
          else
             echo "Build Failed: Image.gz-dtb not found"
             exit 1
          fi

          ZIPNAME="gta4xlve-ksun-$(date +%Y%m%d).zip"
          zip -r9 $GITHUB_WORKSPACE/$ZIPNAME *
          echo "ZIPNAME=$ZIPNAME" >> $GITHUB_ENV

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-flashable-zip
          path: ${{ env.ZIPNAME }}

      - name: Upload Build Log (Debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
