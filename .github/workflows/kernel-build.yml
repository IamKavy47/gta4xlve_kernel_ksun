name: Build gta4xlve Kernel (KSUN)

on:
  workflow_dispatch: # Allows manual trigger
  push:
    branches: [ "copilot/fix-circleci-config-for-kernel" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex gcc-multilib g++-multilib git gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3-pip python3-setuptools

      - name: Setup Toolchains (Clang & GCC)
        run: |
          mkdir -p prebuilts/clang/host/linux-x86
          mkdir -p prebuilts/gcc/linux-x86/aarch64
          mkdir -p prebuilts/gcc/linux-x86/arm
          
          # Download AOSP Clang 17 (r487747c)
          git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 --depth=1 -b master-kernel-build-2023 prebuilts/clang/host/linux-x86/clang-r487747c
          
          # Download GCC for linking
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 --depth=1 prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 --depth=1 prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9

      - name: Build Kernel using build-all.py
        run: |
          # Ensure toolchains are in PATH for the script
          export PATH=$(pwd)/prebuilts/clang/host/linux-x86/clang-r487747c/bin:$(pwd)/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin:$(pwd)/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/bin:$PATH
          
          # Execute your custom build script
          python3 scripts/build-all.py --device gta4xlve --variant ksun

      - name: Package with AnyKernel3
        run: |
          # Locate the built Image.gz-dtb (assuming it's in out/arch/arm64/boot/)
          # This step uses the tools/AnyKernel3 directory in your repo
          cp out/arch/arm64/boot/Image.gz-dtb tools/AnyKernel3/
          cd tools/AnyKernel3
          zip -r9 ../../gta4xlve-kernel-ksun.zip * -x .git README.md

      - name: Upload Flashable Kernel
        uses: actions/upload-artifact@v4
        with:
          name: gta4xlve-KSUN-Kernel
          path: gta4xlve-kernel-ksun.zip
