name: Final Kernel Build (Python 2 + Fixed Args)

on:
  workflow_dispatch:
  push:
    branches: [ "copilot/fix-circleci-config-for-kernel" ]

jobs:
  build:
    name: Build GTA4XLVE Kernel
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Python 2 & Dependencies
        run: |
          sudo apt-get update
          # Install python2 and python-is-python2 to fix 'print' syntax errors
          sudo apt-get install -y python2 python-is-python2
          
          # Install standard build tools
          sudo apt-get install -y bc bison build-essential ccache cpio flex git kmod \
            libncurses5-dev libssl-dev rsync zip unzip wget curl ca-certificates \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu device-tree-compiler

          # Make sure scripts are executable
          chmod +x scripts/build-all.py

      - name: Setup KernelSU-Next
        run: |
          if [ ! -d "KernelSU-Next/kernel" ]; then
            git submodule update --init --recursive
          fi
          mkdir -p drivers
          ln -sf ../KernelSU-Next/kernel drivers/kernelsu
          echo "✓ KernelSU-Next linked"

      - name: Setup Proton Clang
        run: |
          mkdir -p $HOME/toolchains
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 $HOME/toolchains/clang

      - name: Setup AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git $HOME/AnyKernel3
          cd $HOME/AnyKernel3
          cat > anykernel.sh << 'EOF'
          properties() {
          kernel.string=GTA4XLVE KernelSU Kernel
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          device.name1=gta4xlve
          device.name2=gta4xl
          device.name3=SM-P613
          device.name4=SM-P610
          }
          boot_img_hdr_ver=2
          split_boot;
          flash_boot;
          EOF
          chmod +x anykernel.sh

      - name: Build Kernel (Corrected Command)
        run: |
          # Set up paths using $HOME for safety
          export PATH=$HOME/toolchains/clang/bin:$PATH
          
          # Kernel Architecture Variables
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Toolchain Definitions
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE64=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # Proton Clang Specifics (Required for Atoll)
          export LLVM=1
          export LLVM_IAS=1
          
          # Build Info
          export KBUILD_BUILD_USER=GitHub-Actions
          export KBUILD_BUILD_HOST=GitHub

          echo "Starting build with Python 2..."
          python2 --version
          
          # COMMAND FIX: 
          # Removed --device and --variant flags.
          # Passing 'gta4xlve' as the positional target argument.
          python2 scripts/build-all.py gta4xlve

      - name: Create AnyKernel3 Flashable ZIP
        run: |
          cd $HOME/AnyKernel3
          rm -rf .git* README.md
          
          # Check common output locations for the compiled image
          if [ -f $GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "Found Image in out/ directory"
            cp $GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb .
          elif [ -f $GITHUB_WORKSPACE/arch/arm64/boot/Image.gz-dtb ]; then
            echo "Found Image in arch/ directory"
            cp $GITHUB_WORKSPACE/arch/arm64/boot/Image.gz-dtb .
          else
            echo "Error: Image.gz-dtb not found!"
            exit 1
          fi

          ZIPNAME="gta4xlve-ksun-$(date +%Y%m%d).zip"
          zip -r9 $GITHUB_WORKSPACE/$ZIPNAME *
          echo "ZIPNAME=$ZIPNAME" >> $GITHUB_ENV

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-flashable-zip
          path: ${{ env.ZIPNAME }}
