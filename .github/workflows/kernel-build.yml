name: Kernel Build (Python 2 Legacy)

on:
  workflow_dispatch:
  push:
    branches: [ "copilot/fix-circleci-config-for-kernel" ]

jobs:
  build:
    name: Build GTA4XLVE Kernel
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Python 2 and Dependencies
        run: |
          sudo apt-get update
          # Install python2 specifically for the legacy build script
          sudo apt-get install -y python2 bc bison build-essential cpio flex git kmod \
            libncurses5-dev libssl-dev rsync zip unzip wget curl ca-certificates \
            device-tree-compiler
          
          # Verify Python 2 installation
          python2 --version

      - name: Setup KernelSU-Next
        run: |
          if [ ! -d "KernelSU-Next/kernel" ]; then
            git submodule update --init --recursive
          fi
          mkdir -p drivers
          ln -sf ../KernelSU-Next/kernel drivers/kernelsu
          echo "✓ KernelSU-Next linked"

      - name: Setup Proton Clang
        run: |
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 ~/proton-clang

      - name: Setup AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ~/AnyKernel3
          cd ~/AnyKernel3
          cat > anykernel.sh << 'EOF'
          properties() {
          kernel.string=GTA4XLVE KernelSU Kernel
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          device.name1=gta4xlve
          device.name2=gta4xl
          device.name3=SM-P613
          device.name4=SM-P610
          }
          boot_img_hdr_ver=2
          split_boot;
          flash_boot;
          EOF
          chmod +x anykernel.sh

      - name: Build Kernel
        run: |
          # Environment setup for Proton Clang
          export PATH=~/proton-clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1
          export KBUILD_BUILD_USER=GitHub-Actions
          export KBUILD_BUILD_HOST=GitHub

          # Explicitly run the script with the python2 interpreter
          python2 scripts/build-all.py --device gta4xlve --variant ksun

      - name: Create AnyKernel3 Flashable ZIP
        run: |
          cd ~/AnyKernel3
          rm -rf .git* README.md
          
          # Check common output locations for the image
          if [ -f $GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp $GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb .
          elif [ -f $GITHUB_WORKSPACE/arch/arm64/boot/Image.gz-dtb ]; then
            cp $GITHUB_WORKSPACE/arch/arm64/boot/Image.gz-dtb .
          fi

          ZIPNAME="gta4xlve-ksun-$(date +%Y%m%d).zip"
          zip -r9 $GITHUB_WORKSPACE/$ZIPNAME *
          echo "ZIPNAME=$ZIPNAME" >> $GITHUB_ENV

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-flashable-zip
          path: ${{ env.ZIPNAME }}
