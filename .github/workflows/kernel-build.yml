name: Optimized Kernel Build (Cached)

on:
  workflow_dispatch:
  push:
    branches: [ "copilot/fix-circleci-config-for-kernel" ]

jobs:
  build:
    name: Build GTA4XLVE Kernel
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # CACHE STEP: This saves ~5-10 minutes by reusing the compiler
      - name: Cache Proton Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ~/toolchains/clang
          key: ${{ runner.os }}-proton-clang-v1

      - name: Setup Proton Clang
        # Only download if cache was NOT found
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchains
          echo "Cache miss - Cloning Proton Clang..."
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 ~/toolchains/clang

      - name: Install Python 2 & Build Tools
        run: |
          sudo apt-get update
          # Removed 'python-is-python2' which caused the error
          sudo apt-get install -y python2 bc bison build-essential ccache cpio flex git kmod \
            libncurses5-dev libssl-dev rsync zip unzip wget curl ca-certificates \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu device-tree-compiler
          
          # Manually force 'python' command to use python2
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          python --version  # Should print Python 2.7.x

          # Make script executable
          chmod +x scripts/build-all.py

      - name: Setup KernelSU-Next
        run: |
          if [ ! -d "KernelSU-Next/kernel" ]; then
            git submodule update --init --recursive
          fi
          mkdir -p drivers
          ln -sf ../KernelSU-Next/kernel drivers/kernelsu
          echo "✓ KernelSU-Next linked"

      - name: Setup AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ~/AnyKernel3
          cd ~/AnyKernel3
          cat > anykernel.sh << 'EOF'
          properties() {
          kernel.string=GTA4XLVE KernelSU Kernel
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          device.name1=gta4xlve
          device.name2=gta4xl
          device.name3=SM-P613
          device.name4=SM-P610
          }
          boot_img_hdr_ver=2
          split_boot;
          flash_boot;
          EOF
          chmod +x anykernel.sh

      - name: Build Kernel
        run: |
          # Point to the cached clang path
          export PATH=~/toolchains/clang/bin:$PATH
          
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE64=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1
          export KBUILD_BUILD_USER=GitHub-Actions
          export KBUILD_BUILD_HOST=GitHub

          echo "Starting build..."
          # Running with positional argument 'gta4xlve'
          python scripts/build-all.py gta4xlve

      - name: Create AnyKernel3 Flashable ZIP
        run: |
          cd ~/AnyKernel3
          rm -rf .git* README.md
          
          # Check for image in common locations
          if [ -f $GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "Found Image in out/ directory"
            cp $GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb .
          elif [ -f $GITHUB_WORKSPACE/arch/arm64/boot/Image.gz-dtb ]; then
            echo "Found Image in arch/ directory"
            cp $GITHUB_WORKSPACE/arch/arm64/boot/Image.gz-dtb .
          else
            echo "Error: Image.gz-dtb not found! Build likely failed."
            exit 1
          fi

          ZIPNAME="gta4xlve-ksun-$(date +%Y%m%d).zip"
          zip -r9 $GITHUB_WORKSPACE/$ZIPNAME *
          echo "ZIPNAME=$ZIPNAME" >> $GITHUB_ENV

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-flashable-zip
          path: ${{ env.ZIPNAME }}
