name: Kernel Build (AOSP Clang)

on:
  workflow_dispatch:
  push:
    branches: [ lineage-23.2 ]

jobs:
  build:
    name: Build GTA4XLVE Kernel
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1 # Shallow clone for speed

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio flex git kmod \
            libncurses5-dev libssl-dev python3 python-is-python3 \
            rsync zip unzip gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Clone AOSP Clang
        run: |
          # Cloning official AOSP Clang (r383902b is common for 4.14/4.19 kernels)
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 ~/aosp-clang
          # Move to a specific stable version used in AOSP
          cd ~/aosp-clang && git checkout 6760f385c72199b66236b2f4f30c90c749988775 # clang-r383902b

      - name: Fix qcacld-3.0 Werror
        run: |
          # Recursively remove -Werror from the Wi-Fi driver to prevent Error 2
          find drivers/staging/qcacld-3.0 -name "Kbuild" -exec sed -i 's/-Werror//g' {} +
          find drivers/staging/qcacld-3.0 -name "Makefile" -exec sed -i 's/-Werror//g' {} +

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          # Add AOSP Clang to PATH
          export PATH=~/aosp-clang/clang-r383902b/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          mkdir -p out
          
          # Merge configs
          make O=out ARCH=arm64 vendor/atoll-perf_defconfig vendor/gta4xlve.config
          
          # Use 'olddefconfig' to non-interactively accept new KSU options
          make O=out ARCH=arm64 olddefconfig
          
          # Final build command passing CC and CLANG_TRIPLE
          make O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j$(nproc --all)

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: kernel-zip
          path: out/*.zip
