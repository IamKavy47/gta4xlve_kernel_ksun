name: LineageOS Kernel Build (Auto-Patch)

on:
  workflow_dispatch:
  push:
    branches: [ "copilot/fix-circleci-config-for-kernel" ]

jobs:
  build:
    name: Build Kernel (Auto-Patch)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # CACHE: Speed up the build
      # -----------------------------------------------------------------------
      - name: Cache Proton Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ~/toolchains/clang
          key: ${{ runner.os }}-proton-clang-v1

      - name: Setup Proton Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchains
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 ~/toolchains/clang

      # -----------------------------------------------------------------------
      # DEPENDENCIES
      # -----------------------------------------------------------------------
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache cpio flex git kmod \
            libncurses5-dev libssl-dev rsync zip unzip wget curl ca-certificates \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu device-tree-compiler

      # -----------------------------------------------------------------------
      # SURGERY: The Missing Step (Applying Hooks)
      # -----------------------------------------------------------------------
      - name: Apply KernelSU Hooks
        run: |
          # 1. Setup the Driver Symlink
          if [ ! -d "KernelSU-Next/kernel" ]; then
            git submodule update --init --recursive
          fi
          rm -rf drivers/kernelsu # Remove old link if exists to be safe
          mkdir -p drivers
          ln -sf ../KernelSU-Next/kernel drivers/kernelsu
          
          # 2. Add to Makefile (if missing)
          if ! grep -q "kernelsu" drivers/Makefile; then
            echo "obj-y += kernelsu/" >> drivers/Makefile
          fi

          # 3. AUTO-DETECT VERSION & PATCH
          # We check the Makefile to see if this is Kernel 4.14 or 4.19
          KVER=$(grep -m1 "^VERSION =" Makefile | awk '{print $3}').$(grep -m1 "^PATCHLEVEL =" Makefile | awk '{print $3}')
          echo "Detected Kernel Version: $KVER"
          
          # Download the correct patch from official KernelSU repo
          # (KernelSU-Next uses the same hooks as standard KSU)
          if [ "$KVER" == "4.14" ]; then
            wget https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/patches/4.14.patch
            patch -p1 < 4.14.patch || echo "Patch may have already been applied, continuing..."
          elif [ "$KVER" == "4.19" ]; then
             wget https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/patches/4.19.patch
             patch -p1 < 4.19.patch || echo "Patch may have already been applied, continuing..."
          else
             echo "!! Warning: Unknown kernel version $KVER. Skipping auto-patch."
          fi
          
          echo "✓ Hooks Applied Successfully"

      - name: Setup AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ~/AnyKernel3
          cd ~/AnyKernel3
          cat > anykernel.sh << 'EOF'
          properties() {
          kernel.string=GTA4XLVE KernelSU-Next
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          device.name1=gta4xlve
          device.name2=gta4xl
          device.name3=SM-P613
          device.name4=SM-P610
          }
          boot_img_hdr_ver=2
          split_boot;
          flash_boot;
          EOF
          chmod +x anykernel.sh

      # -----------------------------------------------------------------------
      # BUILD
      # -----------------------------------------------------------------------
      - name: Compile Kernel
        run: |
          export PATH=~/toolchains/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE64=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1
          
          # Clean first
          mkdir -p out
          make O=out clean mrproper

          # Generate Config
          echo "--> Generating Base Config..."
          make O=out vendor/atoll-perf_defconfig

          # Merge Fragment
          FRAGMENT="arch/arm64/configs/vendor/gta4xlve.config"
          if [ ! -f $FRAGMENT ]; then FRAGMENT="arch/arm64/configs/gta4xlve.config"; fi
          
          if [ -f $FRAGMENT ]; then
             echo "--> Merging Fragment: $FRAGMENT"
             scripts/kconfig/merge_config.sh -m -O out out/.config $FRAGMENT
             make O=out olddefconfig
          fi

          # Compile
          echo "--> Compiling..."
          make O=out -j$(nproc) Image.gz-dtb dtbo.img 2>&1 | tee build.log

      - name: Create Flashable ZIP
        run: |
          cd ~/AnyKernel3
          rm -rf .git* README.md
          if [ -f $GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb ]; then
             cp $GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb .
          else
             echo "Error: Image.gz-dtb not found. Build Failed."
             exit 1
          fi
          
          if [ -f $GITHUB_WORKSPACE/out/arch/arm64/boot/dtbo.img ]; then
             cp $GITHUB_WORKSPACE/out/arch/arm64/boot/dtbo.img .
          fi

          ZIPNAME="gta4xlve-ksun-$(date +%Y%m%d).zip"
          zip -r9 $GITHUB_WORKSPACE/$ZIPNAME *
          echo "ZIPNAME=$ZIPNAME" >> $GITHUB_ENV

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-flashable-zip
          path: ${{ env.ZIPNAME }}

      - name: Upload Build Log (On Failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
