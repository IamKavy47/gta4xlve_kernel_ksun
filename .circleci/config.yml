version: 2.1

jobs:
  compile:
    docker:
      - image: ubuntu:20.04
    resource_class: large
    steps:
      - run:
          name: Setup and Build
          command: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get -y update
            apt-get -y install git curl bc bison build-essential cpio flex kmod libncurses5 libssl-dev python3 python-is-python3 rsync zip clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

            rm -rf * .git
            git clone --depth=1 --branch=lineage-23.2 https://github.com/IamKavy47/gta4xlve_kernel_ksun.git .
            git submodule update --init --recursive --depth=1

            export ARCH=arm64
            export SUBARCH=arm64
            export CROSS_COMPILE=aarch64-linux-gnu-
            mkdir -p out
            mkdir -p build-logs

            # Capture build start time
            BUILD_START_TIME=$(date)

            # Configure kernel with output capture
            make O=out vendor/atoll-perf_defconfig vendor/gta4xlve.config 2>&1 | tee build-logs/config.log
            yes "" | make O=out oldconfig 2>&1 | tee -a build-logs/config.log

            # Build kernel with maximum parallelism and capture all output
            echo "Starting kernel build with $(nproc --all) parallel jobs..."
            
            make O=out -j$(nproc --all) \
                CC=clang \
                CLANG_TRIPLE=aarch64-linux-gnu- \
                CROSS_COMPILE=aarch64-linux-gnu- \
                2>&1 | tee build-logs/build-full.log
            BUILD_STATUS=$?
            
            # Extract errors and warnings
            grep -i "error:" build-logs/build-full.log > build-logs/errors.log 2>/dev/null || echo "# No errors found" > build-logs/errors.log
            grep -i "warning:" build-logs/build-full.log > build-logs/warnings.log 2>/dev/null || echo "# No warnings found" > build-logs/warnings.log
            
            # Count errors and warnings
            ERROR_COUNT=$(grep -c "error:" build-logs/build-full.log 2>/dev/null || echo 0)
            WARNING_COUNT=$(grep -c "warning:" build-logs/build-full.log 2>/dev/null || echo 0)
            
            echo "Build completed with status: $BUILD_STATUS"
            echo "Total errors: $ERROR_COUNT"
            echo "Total warnings: $WARNING_COUNT"
            
            # Create summary
            cat > build-logs/summary.txt << SUMMARY
            Build Summary
            =============
            Build Exit Code: $BUILD_STATUS
            Total Errors: $ERROR_COUNT
            Total Warnings: $WARNING_COUNT
            Parallel Jobs: $(nproc --all)
            
            Build started: $BUILD_START_TIME
            Build finished: $(date)
            SUMMARY
            
            exit $BUILD_STATUS

      - store_artifacts:
          path: out/arch/arm64/boot/
          destination: kernel-output

      - store_artifacts:
          path: build-logs/
          destination: build-logs

workflows:
  version: 2.1
  cooking:
    jobs:
      - compile
