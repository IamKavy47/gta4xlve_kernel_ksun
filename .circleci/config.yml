version: 2.1
jobs:
  compile:
    docker:
      - image: ubuntu:20.04
    resource_class: large
    steps:
      - checkout
      - run:
          name: Setup Environment and Build
          command: |
            # 1. Install necessary build tools 
            export DEBIAN_FRONTEND=noninteractive
            apt-get -y update && apt-get -y upgrade
            apt-get -y install bc build-essential zip curl libstdc++6 git wget gcc clang libssl-dev rsync flex bison cpio libncurses5 python3 python-is-python3 kmod gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

            # 2. Sync submodules (Ensures KernelSU-Next code is present)
            git submodule update --init --recursive

            # 3. Build setup
            export ARCH=arm64
            export CROSS_COMPILE=aarch64-linux-gnu-
            mkdir -p out

            # 4. Merge the configs for Snapdragon 720G + Tab S6 Lite
            make O=out vendor/atoll-perf_defconfig vendor/gta4xlve.config

            # 5. Handle interactive prompts (The fix for your previous error)
            yes "" | make O=out oldconfig

            # 6. Final Compilation
            make O=out -j$(nproc --all) \
                CC=clang \
                CLANG_TRIPLE=aarch64-linux-gnu- \
                CROSS_COMPILE=aarch64-linux-gnu-

      - store_artifacts:
          path: out/arch/arm64/boot/
          destination: kernel-output
workflows:
  version: 2.1
  cooking:
    jobs:
      - compile
