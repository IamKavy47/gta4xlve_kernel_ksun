version: 2.1

jobs:
  compile:
    docker:
      - image: ubuntu:20.04
    resource_class: large
    steps:
      - run:
          name: Setup and Build
          command: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get -y update
            apt-get -y install git curl bc bison build-essential cpio flex kmod libncurses5 libssl-dev python3 python-is-python3 rsync zip clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

            git clone --depth=1 --branch=lineage-23.2 https://github.com/IamKavy47/gta4xlve_kernel_ksun.git .
            git submodule update --init --recursive --depth=1

            export ARCH=arm64
            export SUBARCH=arm64
            export CROSS_COMPILE=aarch64-linux-gnu-
            mkdir -p out

            make O=out vendor/atoll-perf_defconfig vendor/gta4xlve.config
            yes "" | make O=out oldconfig

            make O=out -j$(nproc --all) \
                CC=clang \
                CLANG_TRIPLE=aarch64-linux-gnu- \
                CROSS_COMPILE=aarch64-linux-gnu-

      - store_artifacts:
          path: out/arch/arm64/boot/
          destination: kernel-output

workflows:
  version: 2.1
  cooking:
    jobs:
      - compile
