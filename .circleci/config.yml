version: 2.1

jobs:
  compile:
    docker:
      - image: ubuntu:22.04
    resource_class: xlarge
    steps:
      - checkout
      - run:
          name: Setup Build Environment
          command: |
            set -e
            export DEBIAN_FRONTEND=noninteractive
            
            # Install dependencies
            apt-get -y update
            apt-get -y install --no-install-recommends \
              git git-lfs curl wget ca-certificates \
              bc bison build-essential ccache cpio \
              flex kmod libncurses5 libncurses5-dev \
              libssl-dev python3 python3-pip python-is-python3 \
              rsync zip unzip xz-utils \
              clang lld llvm \
              gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
              file
            
            # Clean up to save space
            apt-get clean
            rm -rf /var/lib/apt/lists/*
            
      - run:
          name: Clone Toolchain
          command: |
            set -e
            
            # Use Proton Clang for better kernel compilation
            git clone --depth=1 https://github.com/kdrag0n/proton-clang ~/proton-clang
            
      - run:
          name: Initialize KernelSU Submodule
          command: |
            set -e
            
            # Initialize KernelSU-Next submodule
            git submodule update --init --recursive --depth=1
            
      - run:
          name: Build Kernel
          no_output_timeout: 60m
          command: |
            set -e
            
            # Export build variables
            export ARCH=arm64
            export SUBARCH=arm64
            export PATH=~/proton-clang/bin:$PATH
            export CROSS_COMPILE=aarch64-linux-gnu-
            export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
            export CC=clang
            export CLANG_TRIPLE=aarch64-linux-gnu-
            export LLVM=1
            export LLVM_IAS=1
            
            # Create output directory
            mkdir -p out
            
            # Build kernel configuration
            echo "Building kernel configuration..."
            make O=out ARCH=arm64 vendor/atoll-perf_defconfig
            
            # Merge device-specific configuration
            echo "Merging device configuration..."
            cat arch/arm64/configs/vendor/gta4xlve.config >> out/.config
            
            # Update config for any new options
            make O=out ARCH=arm64 olddefconfig
            
            # Build kernel
            echo "Building kernel image..."
            make O=out ARCH=arm64 \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-gnu- \
              LLVM=1 \
              LLVM_IAS=1 \
              -j$(nproc --all)
            
            # Check if kernel image was built
            if [ ! -f out/arch/arm64/boot/Image.gz-dtb ] && [ -f out/arch/arm64/boot/Image.gz ]; then
              echo "Creating Image.gz-dtb..."
              cat out/arch/arm64/boot/Image.gz out/arch/arm64/boot/dts/qcom/*.dtb > out/arch/arm64/boot/Image.gz-dtb
            fi
            
            echo "Kernel build completed!"
            ls -lh out/arch/arm64/boot/
            
      - run:
          name: Prepare AnyKernel3 Package
          command: |
            set -e
            
            # Clone AnyKernel3
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ~/AnyKernel3
            cd ~/AnyKernel3
            
            # Clean up
            rm -rf .git README.md modules patch ramdisk .github
            
            # Copy kernel image
            if [ -f /home/circleci/project/out/arch/arm64/boot/Image.gz-dtb ]; then
              cp /home/circleci/project/out/arch/arm64/boot/Image.gz-dtb ~/AnyKernel3/
            elif [ -f /home/circleci/project/out/arch/arm64/boot/Image.gz ]; then
              cp /home/circleci/project/out/arch/arm64/boot/Image.gz ~/AnyKernel3/
            fi
            
            # Copy dtb if separate
            if [ -f /home/circleci/project/out/arch/arm64/boot/dtb.img ]; then
              cp /home/circleci/project/out/arch/arm64/boot/dtb.img ~/AnyKernel3/
            fi
            
            # Copy kernel modules
            mkdir -p ~/AnyKernel3/modules/vendor/lib/modules
            find /home/circleci/project/out -name "*.ko" -exec cp {} ~/AnyKernel3/modules/vendor/lib/modules/ \; 2>/dev/null || true
            
            # Update AnyKernel3 properties
            cat > ~/AnyKernel3/anykernel.sh << 'AKEOF'
            # AnyKernel3 Ramdisk Mod Script
            # osm0sis @ xda-developers
            
            ## AnyKernel setup
            # begin properties
            properties() { 
            kernel.string=GTA4XLVE Kernel with KernelSU-Next
            do.devicecheck=1
            do.modules=1
            do.systemless=1
            do.cleanup=1
            do.cleanuponabort=0
            device.name1=gta4xlve
            device.name2=gta4xlvewifi
            device.name3=SM-P610
            supported.versions=11-14
            supported.patchlevels=
            }
            
            # shell variables
            block=/dev/block/bootdevice/by-name/boot;
            is_slot_device=0;
            ramdisk_compression=auto;
            patch_vbmeta_flag=auto;
            
            ## AnyKernel methods (DO NOT CHANGE)
            # import patching functions/variables - see for reference
            . tools/ak3-core.sh;
            
            ## AnyKernel install
            dump_boot;
            
            # begin ramdisk changes
            
            # end ramdisk changes
            
            write_boot;
            ## end install
            AKEOF
            
            # Create flashable zip
            cd ~/AnyKernel3
            KERNEL_VERSION="4.14.356"
            BUILD_DATE=$(date +%Y%m%d-%H%M)
            ZIP_NAME="GTA4XLVE-KernelSU-${KERNEL_VERSION}-${BUILD_DATE}.zip"
            zip -r9 /home/circleci/project/out/${ZIP_NAME} * -x .git README.md *placeholder
            
            echo "Flashable zip created: ${ZIP_NAME}"
            ls -lh /home/circleci/project/out/${ZIP_NAME}
            
      - store_artifacts:
          path: out/arch/arm64/boot/Image
          destination: kernel-image/Image
          
      - store_artifacts:
          path: out/arch/arm64/boot/Image.gz
          destination: kernel-image/Image.gz
          
      - store_artifacts:
          path: out/arch/arm64/boot/Image.gz-dtb
          destination: kernel-image/Image.gz-dtb
          
      - store_artifacts:
          path: out/
          destination: build-artifacts
          
      - store_artifacts:
          path: out/*.zip
          destination: flashable-zip

workflows:
  version: 2.1
  build_kernel:
    jobs:
      - compile
